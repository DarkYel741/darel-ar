<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Darel AR</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* ❗ NO BLACK SCREEN */
        }

        a-scene {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: transparent !important;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #startBtn {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
            font-size: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="startBtn">Tap to Enable Sound</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true" embedded>

        <!-- VIDEO -->
        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- CAMERA -->
        <a-camera look-controls="enabled: false"></a-camera>

        <!-- AR TARGET (STABLE) -->
        <a-entity mindar-image-target="targetIndex: 0" smooth="true" smoothCount="20" smoothTolerance="0.005"
            smoothThreshold="2">

            <!-- CENTERED PLANE -->
            <a-plane id="plane" src="#video" position="0 0 0.01" width="1" height="1"
                material="shader: flat; transparent: true"></a-plane>

        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const video = document.querySelector("#video");
        const plane = document.querySelector("#plane");
        const btn = document.querySelector("#startBtn");

        let unlocked = false;
        let playing = false;

        // 🔊 unlock audio (required by browser)
        btn.addEventListener("click", () => {
            unlocked = true;
            video.muted = false;
            video.volume = 1.0;
            btn.style.display = "none";
        });

        // 📐 FIT HEIGHT + CENTER FIX
        video.addEventListener("loadedmetadata", () => {
            const aspect = video.videoWidth / video.videoHeight;

            const height = 1;   // fixed to target height
            const width = aspect;

            plane.setAttribute("width", width);
            plane.setAttribute("height", height);

            // 🧠 FIX: center correction (important for "stuck to bottom" bug)
            plane.setAttribute("position", "0 0 0.01");
        });

        // 🎯 START VIDEO + SOUND TOGETHER
        scene.addEventListener("targetFound", async () => {
            if (!unlocked) return;

            if (!playing) {
                video.currentTime = 0;
                video.muted = false;
                video.volume = 1.0;

                try {
                    await video.play();
                    playing = true;
                } catch (e) {
                    console.log("play error:", e);
                }
            }
        });

        // ⛔ STOP ON LOST
        scene.addEventListener("targetLost", () => {
            video.pause();
            playing = false;
        });
    </script>

</body>

</html>
