<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Darel AR</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* ❗ no black screen */
        }

        a-scene {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: transparent !important;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #startBtn {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
            font-size: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="startBtn">Tap to Enable Sound</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true" embedded>

        <!-- VIDEO -->
        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- CAMERA -->
        <a-camera look-controls="enabled: false"></a-camera>

        <!-- TARGET -->
        <a-entity mindar-image-target="targetIndex: 0" smooth="true" smoothCount="20" smoothTolerance="0.005"
            smoothThreshold="2">

            <a-plane id="plane" src="#video" position="0 0 0.01" width="1" height="1"
                material="shader: flat; transparent: true"></a-plane>

        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const video = document.querySelector("#video");
        const plane = document.querySelector("#plane");
        const btn = document.querySelector("#startBtn");

        let unlocked = false;
        let playing = false;

        // 🔊 unlock audio
        btn.addEventListener("click", () => {
            unlocked = true;
            video.muted = false;
            video.volume = 1.0;
            btn.style.display = "none";
        });

        // 🎯 FIX: correct cover behavior (NO distortion + centered)
        video.addEventListener("loadedmetadata", () => {
            const aspect = video.videoWidth / video.videoHeight;

            const mesh = plane.getObject3D("mesh");
            const material = mesh.material;

            const map = material.map;

            if (!map) return;

            // reset
            map.repeat.set(1, 1);
            map.offset.set(0, 0);

            // 📐 cover logic (crop instead of stretch)
            if (aspect > 1) {
                // horizontal → crop sides
                map.repeat.set(1 / aspect, 1);
                map.offset.set((1 - 1 / aspect) / 2, 0);
            } else {
                // vertical → crop top/bottom
                map.repeat.set(1, aspect);
                map.offset.set(0, (1 - aspect) / 2);
            }

            map.needsUpdate = true;
        });

        // ▶ start sync audio + video
        scene.addEventListener("targetFound", async () => {
            if (!unlocked) return;

            if (!playing) {
                video.currentTime = 0;
                video.muted = false;
                video.volume = 1.0;

                try {
                    await video.play();
                    playing = true;
                } catch (e) {
                    console.log("play error:", e);
                }
            }
        });

        // ⛔ stop
        scene.addEventListener("targetLost", () => {
            video.pause();
            playing = false;
        });
    </script>

</body>

</html>
