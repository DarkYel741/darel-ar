<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darel AR - Optimized</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        a-scene {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        #startBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="startBtn">Нажмите, чтобы включить звук</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        renderer="alpha: true; antialias: true; colorManagement: true; precision: mediump" embedded>

        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
        </a-assets>

        <a-camera look-controls="enabled: false"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0" smooth="true" smoothCount="12" smoothTolerance="0.01"
            smoothThreshold="5">

            <a-plane id="plane" src="#video" position="0 0 0.02" width="1" height="1"
                material="shader: flat; transparent: true; side: double"></a-plane>

        </a-entity>

    </a-scene>

    <script>
        const video = document.querySelector("#video");
        const plane = document.querySelector("#plane");
        const btn = document.querySelector("#startBtn");
        const scene = document.querySelector("a-scene");

        let unlocked = false;

        // Разблокировка звука
        btn.addEventListener("click", () => {
            unlocked = true;
            video.muted = false;
            video.volume = 1.0;
            btn.style.display = "none";
        });

        // Идеальная подгонка видео под размеры вашего таргета (453x683)
        const adjustSize = () => {
            if (!video.videoWidth) return;

            const videoAspect = video.videoWidth / video.videoHeight;
            const targetAspect = 453 / 683; // Пропорции из вашего .mind файла

            let scaleX, scaleY;

            // Логика "Cover" (Заполнение без пустот)
            if (videoAspect > targetAspect) {
                // Видео шире, чем нужно — подгоняем по высоте
                scaleX = videoAspect / targetAspect;
                scaleY = 1;
            } else {
                // Видео уже, чем нужно — подгоняем по ширине
                scaleX = 1;
                scaleY = targetAspect / videoAspect;
            }

            plane.setAttribute("scale", `${scaleX} ${scaleY} 1`);
        };

        video.addEventListener("loadedmetadata", adjustSize);
        if (video.readyState >= 1) adjustSize();

        // Управление воспроизведением
        scene.addEventListener("targetFound", () => {
            if (unlocked) {
                video.play().catch(e => console.log("Ошибка воспроизведения:", e));
            }
        });

        scene.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>

</body>

</html>
