<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Darel AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- FULLSCREEN FIX -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #startBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-family: Arial;
        }
    </style>
</head>

<body>

    <!-- TAP ONLY FOR AUDIO UNLOCK -->
    <div id="startBtn">Tap to Enable AR Sound</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true" embedded>

        <!-- VIDEO -->
        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- CAMERA -->
        <a-camera look-controls="enabled: false"></a-camera>

        <!-- AR TARGET -->
        <a-entity mindar-image-target="targetIndex: 0">

            <a-video src="#video" position="0 0 0" scale="2 2 2"></a-video>

        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const video = document.querySelector("#video");
        const btn = document.querySelector("#startBtn");

        let unlocked = false;
        let isPlaying = false;

        // 1. только unlock звука (НЕ запуск видео)
        btn.addEventListener("click", () => {
            unlocked = true;
            video.muted = false;
            btn.style.display = "none";
        });

        // 2. СТАРТ ТОЛЬКО при распознавании AR
        scene.addEventListener("targetFound", async () => {
            if (!unlocked) return;

            if (!isPlaying) {
                video.currentTime = 0;
                await video.play();
                isPlaying = true;
            }
        });

        // 3. Пауза при потере
        scene.addEventListener("targetLost", () => {
            video.pause();
            isPlaying = false;
        });
    </script>

</body>

</html>
