<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darel AR - High Precision</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #startBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            cursor: pointer;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div id="startBtn">
        <div class="icon">🔊</div>
        <div>Нажмите, чтобы начать</div>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.1; warmupTolerance: 3; missTolerance: 3;"
        renderer="antialias: true; colorManagement: true; precision: mediump" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false" embedded>

        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
        </a-assets>

        <a-camera look-controls="enabled: false"></a-camera>

        <a-entity id="target0" mindar-image-target="targetIndex: 0" smooth="true" smoothCount="5" smoothTolerance="0.01"
            smoothThreshold="2">

            <a-plane id="plane" src="#video" position="0 0 0.01"
                material="shader: flat; side: double; transparent: true">
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector("#video");
        const plane = document.querySelector("#plane");
        const btn = document.querySelector("#startBtn");
        const scene = document.querySelector("a-scene");

        // 1. Разблокировка аудио и скрытие кнопки
        btn.addEventListener("click", () => {
            video.muted = false;
            video.play().then(() => {
                video.pause(); // Готовим видео к автозапуску при нахождении цели
                btn.style.display = "none";
            });
        });

        // 2. Идеальный расчет пропорций (2245 x 3179)
        const adjustAspectRatio = () => {
            if (!video.videoWidth) return;

            const targetWidth = 2245;
            const targetHeight = 3179;
            const targetAspect = targetWidth / targetHeight; // 0.70619

            const videoAspect = video.videoWidth / video.videoHeight;

            let scaleX, scaleY;

            // Алгоритм COVER: заполняем весь таргет без щелей
            if (videoAspect > targetAspect) {
                // Видео шире таргета
                scaleX = videoAspect / targetAspect;
                scaleY = 1;
            } else {
                // Видео уже таргета
                scaleX = 1;
                scaleY = targetAspect / videoAspect;
            }

            plane.setAttribute("scale", `${scaleX} ${scaleY} 1`);
        };

        // Следим за загрузкой видео
        video.addEventListener("loadedmetadata", adjustAspectRatio);
        if (video.readyState >= 1) adjustAspectRatio();

        // 3. Управление воспроизведением при наведении
        scene.addEventListener("targetFound", () => {
            video.play();
        });

        scene.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>
</body>

</html>
