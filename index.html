<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Darel AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        a-scene {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #startBtn {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
            font-size: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div id="startBtn">Tap to Enable AR</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true" embedded>

        <!-- VIDEO -->
        <a-assets>
            <video id="video" src="./video.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-camera look-controls="enabled: false"></a-camera>

        <!-- STABLE TARGET -->
        <a-entity mindar-image-target="targetIndex: 0" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">

            <!-- SMART VIDEO PLANE -->
            <a-plane id="plane" src="#video" position="0 0 0.01" material="shader: flat; transparent: true"></a-plane>

        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const video = document.querySelector("#video");
        const plane = document.querySelector("#plane");
        const btn = document.querySelector("#startBtn");

        let unlocked = false;
        let playing = false;

        // 1. unlock audio ONLY
        btn.addEventListener("click", () => {
            unlocked = true;
            video.muted = false;
            btn.style.display = "none";
        });

        // 2. auto aspect ratio fix (KEY PART)
        video.addEventListener("loadedmetadata", () => {
            const aspect = video.videoWidth / video.videoHeight;

            const baseHeight = 1.0;
            const baseWidth = baseHeight * aspect;

            plane.setAttribute("width", baseWidth);
            plane.setAttribute("height", baseHeight);
        });

        // 3. start ONLY on AR detection
        scene.addEventListener("targetFound", async () => {
            if (!unlocked) return;

            if (!playing) {
                video.currentTime = 0;
                await video.play();
                playing = true;
            }
        });

        // 4. pause on lost target
        scene.addEventListener("targetLost", () => {
            video.pause();
            playing = false;
        });
    </script>

</body>

</html>
